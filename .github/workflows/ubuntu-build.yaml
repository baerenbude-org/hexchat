name: Ubuntu Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  ubuntu_build:
    name: Ubuntu GCC/Meson Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            libcanberra-dev \
            libdbus-glib-1-dev \
            libglib2.0-dev \
            libgtk2.0-dev \
            libluajit-5.1-dev \
            libpci-dev \
            libperl-dev \
            libssl-dev \
            python3-dev \
            python3-cffi \
            mono-devel \
            desktop-file-utils

      - name: Configure Meson
        run: meson setup build -Dtext-frontend=true -Dtheme-manager=true -Dauto_features=enabled

      - name: Build with Ninja
        run: ninja -C build

      - name: Run Tests
        run: ninja -C build test

      - name: Install
        run: sudo ninja -C build install
